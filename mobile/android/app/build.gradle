apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

import com.android.build.OutputFile

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    entryFile = "index.js"
    
    bundleInRelease = true
    bundleInDebug = false
    bundleInVariants = []
    
    bundleCommand = "ram-bundle"
    bundleConfig = null
    bundleAssetName = "index.android.bundle"
    
    hermesEnabled = true
    debuggableVariants = ['debug']
    
    codegenDir = file("../node_modules/react-native-codegen")
    reactNativeDir = file("../node_modules/react-native")
    
    inputExcludes = ["android/**", "ios/**"]
}

/**
 * Set this to true to create two separate APKs instead of one:
 *   - An APK that only works on ARM devices
 *   - An APK that only works on x86 devices
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    
    compileSdkVersion rootProject.ext.compileSdkVersion
    
    namespace "com.instagramclone"
    
    defaultConfig {
        applicationId "com.instagramclone.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        
        multiDexEnabled true
        
        resValue "string", "app_name", "Instagram Clone"
        resValue "string", "facebook_app_id", "your_facebook_app_id"
        
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            debuggable false
            zipAlignEnabled true
        }
    }
    
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
    
    packagingOptions {
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    
    // React Native dependencies
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-linear-gradient')
    implementation project(':react-native-fast-image')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-screens')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-async-storage')
    
    // Camera and Media
    implementation project(':react-native-image-picker')
    implementation project(':react-native-image-crop-picker')
    implementation project(':react-native-video')
    implementation project(':react-native-camera')
    implementation project(':react-native-permissions')
    
    // Payment and UPI
    implementation project(':react-native-razorpay')
    implementation project(':react-native-upi-payment')
    
    // Social Login
    implementation project(':react-native-google-signin')
    
    // Security and Biometrics
    implementation project(':react-native-biometrics')
    implementation project(':react-native-keychain')
    
    // Device Info and Utils
    implementation project(':react-native-device-info')
    implementation project(':react-native-webview')
    implementation project(':react-native-orientation-locker')
    implementation project(':react-native-splash-screen')
    
    // UI Components
    implementation project(':react-native-svg')
    implementation project(':lottie-react-native')
    implementation project(':react-native-modal')
    
    // Location and Maps
    implementation project(':react-native-maps')
    implementation project(':react-native-location')
    
    // Other utilities
    implementation project(':react-native-share')
    implementation project(':react-native-push-notification')
    implementation project(':react-native-sound')
    implementation project(':react-native-haptic-feedback')
    
    // Razorpay
    implementation 'com.razorpay:checkout:1.6.19'
    
    // Google Services
    implementation 'com.google.android.gms:play-services-auth:20.4.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    
    // Biometric Authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Camera X
    implementation 'androidx.camera:camera-camera2:1.2.0'
    implementation 'androidx.camera:camera-lifecycle:1.2.0'
    implementation 'androidx.camera:camera-view:1.2.0'
    
    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    
    // Video Processing
    implementation 'com.google.android.exoplayer:exoplayer:2.18.2'
    
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.fbjni'
    }
    
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.flipper'
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.flipper'
    }
    
    if (enableHermes) {
        implementation("com.facebook.react:hermes-engine:+") {
            exclude group:'com.facebook.fbjni'
        }
    } else {
        implementation jscFlavor
    }
}

// Run this once to be able to run the application with BUCK
task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.implementation
    into 'libs'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)